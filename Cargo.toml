[package]
name = "proton-launch"
version = "0.3.0"
edition = "2024"
authors = ["liangzhaoyuan12"]
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_18", "v1_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
